name: Build our Code ( as of now )

on:
  push:
    branches: ["main"]

jobs:
  # name of the job
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: pulling our git repo 
        uses: actions/checkout@v6

      - name: Installing Python 3.13.5
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.5' 


